name: PSScriptAnalyzer Lint

on:
  push:
    branches: ['**']
    paths: ['**.ps1']
  pull_request:
    branches: [main]
    paths: ['**.ps1']

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer on core/
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./core/ -Recurse -Severity Warning,Error -ExcludeRule PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer знайшов помилки в core/"
            exit 1
          }

      - name: Run PSScriptAnalyzer on settings/
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./settings/ -Recurse -Severity Warning,Error -ExcludeRule PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingWriteHost,PSAvoidUsingInvokeExpression
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer знайшов помилки в settings/"
            exit 1
          }

      - name: Run PSScriptAnalyzer on entry scripts and tools/
        shell: pwsh
        run: |
          $results = @('./Run-Hardening.ps1', './Apply-GPO.ps1', './tools/Get-LGPO.ps1') |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost }
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            Write-Error "PSScriptAnalyzer знайшов помилки в точках входу"
            exit 1
          }

      - name: Parse all scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { Write-Host "$($_.FullName): $($errors[0].Message)"; $failed++ }
          }
          if ($failed) { Write-Error "$failed file(s) fail to parse in PowerShell 5.1 (UTF-8 without BOM?)"; exit 1 }

  pester:
    name: Pester Tests (structure)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0

      # Лише статичні тести: вони не змінюють систему. Функціональні Apply/Revert — pester.yml вручну.
      - name: Run Pester Tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = @(
            './tests/Policies.Format.Tests.ps1',
            './tests/ApplyAll.Tests.ps1',
            './tests/Settings.Check.Tests.ps1',
            './tests/ErrorReport.Tests.ps1'
          )
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = './test-results.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $cfg
