# Pester Hardening Tests — функціональне тестування Apply → Verify → Revert
# Вимоги: Windows, права адміністратора, Pester 5+
# Лише ручний запуск: тести змінюють систему, а раннер windows-latest — це Windows Server, не Win11.
# Обов'язкова перевірка PR — «Pester Tests (structure)» у lint.yml (статичні тести).

name: Pester Hardening Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester Hardening Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Встановити Pester 5.x
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0

      - name: Запустити PSScriptAnalyzer на тестах
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./tests/ -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) {
            Write-Error "PSScriptAnalyzer знайшов помилки в tests/"
            exit 1
          }

      - name: Запустити Pester-тести
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path             = './tests/'
          $cfg.Run.Exit             = $true
          $cfg.Output.Verbosity     = 'Detailed'
          $cfg.TestResult.Enabled   = $true
          $cfg.TestResult.OutputPath = './test-results.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $cfg

      - name: Завантажити результати тестів
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pester-results
          path: ./test-results.xml
