# actionlint + zizmor (.github), shellcheck (*.sh), gitleaks (уся історія) — scripts/lint-ci.sh.
name: lint-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks у lint-ci сканує всю історію

      - name: Інструменти lint-ci (shellcheck, actionlint, zizmor, gitleaks)
        run: |
          pipx install shellcheck-py==0.11.0.1
          pipx install actionlint-py==1.7.12.25
          pipx install zizmor==1.32.0
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: bash scripts/lint-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}
